---
$schema: https://json-schema.org/schema#
$id: https://claudeinstall.io/schemas/distroprofile.json
additionalProperties: false
type: object
properties:
    profilesDir: { type: string }
    assetsDir: { type: string }
    profileKey: { type: string }
    phase: { type: string, enum: [ install, customize ] }
    retries: { type: integer, minimum: 0 }
    wirelessRegdom: { type: string }

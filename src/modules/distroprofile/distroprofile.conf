#
# Sets a system up from a distro profile (see profiles/*.conf).
#
# Use the module twice in settings.conf, as two instances:
#   distroprofile@install     phase "install":   profile's install steps + pacstrap (replaces unpackfs)
#   distroprofile@customize   phase "customize": profile's customize steps; run after the users module
---
# Where the profiles and the files they copy from are installed.
profilesDir: /usr/share/claudeinstall/profiles
assetsDir:   /usr/share/claudeinstall/needed-files

# Global-storage key that holds the chosen profile id. The packagechooser
# instance "distro" (packagechooser-distro.conf) fills "packagechooser_distro".
profileKey: packagechooser_distro

# "install" or "customize"
phase: install

# Extra attempts after pacstrap fails (package lists are refreshed in between).
retries: 3

# Wireless regulatory domain written to /etc/conf.d/wireless-regdom by a
# profile's "regdom" step: a two-letter country code, or empty to use the
# country of the time zone chosen in the locale step.
wirelessRegdom: ""

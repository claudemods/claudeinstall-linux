#
# Sets a system up from a distro profile (see profiles/*.conf).
#
# Use the module twice in settings.conf, as two instances:
#   distroprofile@install     phase "install":   profile's install steps + pacstrap (replaces unpackfs)
#   distroprofile@customize   phase "customize": profile's customize steps; run after the users module
---
# Where the profiles and the files they copy from are installed.
profilesDir: /usr/share/claudeinstall/profiles
assetsDir:   /usr/share/claudeinstall/needed-files

# Normally leave these empty: the small local files come from needed-files/ (installed to
# assetsDir by build.sh) and the big theme / tool zips are downloaded by the profiles.
# Optional: if assetsDir is empty or missing, this zip is downloaded and unpacked there instead
# (https only; sha256 is checked when given).
assetsUrl:    ""
assetsSha256: ""

# Global-storage key that holds the chosen profile id. The packagechooser
# instance "distro" (packagechooser-distro.conf) fills "packagechooser_distro".
profileKey: packagechooser_distro

# "install" or "customize"
phase: install

# Extra attempts after pacstrap fails (package lists are refreshed in between).
retries: 5

# Package names are checked against the repositories before pacstrap runs. A name that is
# gone is replaced by its successor (profiles/package-renames.conf, "replaces" / "provides" of
# the repositories, -git/-bin suffixes). If nothing replaces it:
#   fail  stop before downloading anything, with suggestions (default)
#   warn  drop the name and log it
unresolvedPackages: fail
# Extra renames, same as in package-renames.conf (this wins over the file):
# packageRenames: { old-name: new-name }

# Wireless regulatory domain written to /etc/conf.d/wireless-regdom by a profile's "regdom"
# step. It is asked on the "Wireless region" page (packagechooser-regdom.conf, key regdomKey).
# wirelessRegdom is only the fallback when that page was left on "Automatic": a two-letter
# country code, or empty to use the country of the time zone chosen in the locale step.
regdomKey: packagechooser_regdom
wirelessRegdom: ""

# Package download speed and patience
# Before downloading, the internet connection is checked (ping + DNS; waits up to 2 min for it).
# Every mirror list used by pacman.conf is then tested: a ping test of all servers (a server must
# answer with the repository database, so dead links are dropped), then a real download speed
# test of the closest ones. The list is rewritten fastest first. The live download / upload
# speed is shown in the progress view.
rankMirrors:      true  # test the servers of every mirror list, fastest first
archMirrorStatus: true  # Arch's mirrorlist: add the synced mirrors of archlinux.org/mirrors/status, drop out-of-date ones
mirrorSpeedTests: 6     # closest servers per list whose download speed is measured (about 5 s each)
mirrorKeep:       10    # servers kept per list
# Watchdog: every stallSeconds pacstrap must have downloaded at least stallMinKiBps on average,
# or be installing. If not, it is stopped, its servers are not used again, the mirrors are
# tested again and pacstrap retries with the fastest working one (0 = never stop it).
stallSeconds:     300
stallMinKiBps:    20

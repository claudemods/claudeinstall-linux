#
# Wireless regulatory domain page (instance "regdom" of packagechooser). The chosen
# two-letter code is stored as packagechooser_regdom; distroprofile writes it to
# /etc/conf.d/wireless-regdom. The first entry keeps the time zone's country.
---
mode: required
method: legacy
labels:
    step: "Wireless region"
items:
    - id: auto
      name: "Automatic (country of the time zone)"
      description: "Use the country of the time zone chosen earlier."
      screenshot: ":/images/claudeinstall.png"

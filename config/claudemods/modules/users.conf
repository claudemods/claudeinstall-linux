#
# Only used when the "users" module is switched on (claudeconfig mode new).
---
defaultGroups:
    - lp
    - network
    - power
    - sys
    - wheel
autologinGroup:  autologin
doAutologin:     false
displayAutologin:   true
sudoersGroup:    wheel
passwordRequirements:
    nonempty: true
setRootPassword: true
doReusePassword: false
user:
  shell: /usr/bin/zsh
  forbidden_names: [ root ]
  home_permissions: "o700"

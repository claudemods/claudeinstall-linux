#
# The live system forgets everything at reboot, so the installer log is copied into the
# installed system. After the first boot it can be read (and sent when something went
# wrong) from /var/log/ClaudeInstall.log.
---
files:
  - from: log
    dest: /var/log/ClaudeInstall.log
    perm: root:root:644
    optional: true

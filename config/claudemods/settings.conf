#
# claudemods preset: clone the live system (squashfs or erofs image) to disk.
# No users are created; the image's accounts carry over. Switch with
#   claudeconfig mode clone|new
#
# Not carried over from the Calamares/Manjaro setup: the "mhwdcfg" and "postcfg"
# modules do not exist in ClaudeInstall ("services" is now "services-systemd").
---
modules-search: [ local ]

sequence:
    - show:
        - welcome
        - locale
        - keyboard
        - partition
        # users
        # packagechooser
        - summary
    - exec:
        - partition
        - mount
        - unpackfs
        - networkcfg
        - machineid
        - locale
        - keyboard
        - localecfg
        - luksbootkeyfile
        - luksopenswaphookcfg
        - fstab
        - initcpiocfg
        - initcpio
        # users
        - displaymanager
        - hwclock
        - services-systemd
        - grubcfg
        - bootloader
        - umount
    - show:
        - finished

branding: default

prompt-install: true

dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false

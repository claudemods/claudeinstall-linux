#
# CachyOS desktops (from needed/cachyos.h). The meta-package names the whole system; the
# steps are the ones setup_installation_environment() and install_calamares() ran.
# Variables: DM = display manager unit to enable (empty = none).
---
abstract: true
vars:
  DM: ""

install:
  - { type: copy,    from: pacman.conf,      to: /etc/pacman.conf, host: true }
  - { type: hostRun, command: "unzip -o @ASSETS@/pacman.d.zip -d /etc/pacman.d" }
  - { type: copy,    from: 11-dm-initramfs.rules, to: /usr/lib/initcpio/udev/11-dm-initramfs.rules }
  - { type: copy,    from: 11-dm-initramfs.rules, to: /usr/lib/initcpio/udev/11-dm-initramfs.rules, host: true }
  - { type: hostRun, command: "pacman -Sy --noconfirm && pacman -S --noconfirm --needed archlinux-keyring", optional: true }

customize:
  - { type: copy,    from: pacman.conf,      to: /etc/pacman.conf }
  - { type: hostRun, command: "unzip -o @ASSETS@/pacman.d.zip -d @ROOT@/etc/pacman.d" }
  - { type: hostRun, command: "cp -L /etc/resolv.conf @ROOT@/etc/resolv.conf", optional: true }
  - { type: run,     command: "systemctl enable NetworkManager" }
  - { type: run,     command: "systemctl enable @DM@", optional: true, when: DM }

  # home layout
  - { type: mkdir,   path: "@HOME@/Desktop" }
  - { type: mkdir,   path: "@HOME@/Documents" }
  - { type: mkdir,   path: "@HOME@/Downloads" }
  - { type: mkdir,   path: "@HOME@/Music" }
  - { type: mkdir,   path: "@HOME@/Pictures" }
  - { type: mkdir,   path: "@HOME@/Videos" }
  - { type: mkdir,   path: "@HOME@/Public" }
  - { type: mkdir,   path: "@HOME@/Templates" }

  # fish as the login shell
  - { type: mkdir,   path: "@HOME@/.config/fish" }
  - { type: mkdir,   path: "@HOME@/.local/share/konsole" }
  - { type: copy,    from: fish_variables, to: "@HOME@/.config/fish/fish_variables" }
  - { type: run,     command: "chsh -s $(which fish) @USER@", optional: true }
  - { type: run,     command: "chmod +x /usr/share/fish/config.fish", optional: true }

  # boot look: the Spitfire grub file, the CachyOS boot files, the plymouth animation
  - { type: copy,    from: "spitfire-ckge-minimal/grub", to: /etc/default/grub }
  - { type: hostRun, command: "unzip -o -q @ASSETS@/bootcachyos.zip -d @ROOT@/boot" }
  - { type: run,     command: "plymouth-set-default-theme -R cachyos-bootanimation", optional: true }

  # wireless regulatory domain (your file, with the chosen code made active)
  - { type: mkdir,   path: /etc/conf.d }
  - { type: copy,    from: wireless-regdom, to: /etc/conf.d/wireless-regdom, optional: true }
  - { type: regdom }

  - { type: run,     command: "chown -R @USER@:@USER@ @HOME@" }
  - { type: run,     command: "rm -rf /var/cache/pacman/pkg/*", optional: true }

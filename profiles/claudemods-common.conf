#
# Shared steps of every claudemods distribution (the part of claudemods.h that is
# the same for all variants). Not offered in the chooser: variants "extends:" it,
# through a family file (spitfire / apex).
#
# Step types: copy (from needed-files/ to the target, host: true = to the live system),
#   mkdir, remove, enable (systemd units), run (in the target), runAsUser (as the new
#   user), hostRun (on the live system), download (https + sha256 -> dest, .zip unpacked),
#   regdom (writes /etc/conf.d/wireless-regdom). "optional: true" turns a failure into a warning.
# Placeholders: @USER@ @HOME@ @ROOT@ @ASSETS@ and the profile's vars.
#
# Locale, keyboard, users, fstab, initramfs and the bootloader are done by the
# regular ClaudeInstall modules, so they are not repeated here.
---
abstract: true

# Run on the live system, then packages are bootstrapped with pacstrap.
install:
  # custom repositories and mirrors, as setup_pacman_and_files() did
  - { type: copy,    from: pacman.conf,      to: /etc/pacman.conf, host: true }
  - { type: hostRun, command: "unzip -o @ASSETS@/pacman.d.zip -d /etc/pacman.d" }
  # needed while the kernel's initramfs is built during pacstrap
  - { type: copy,    from: 11-dm-initramfs.rules, to: /usr/lib/initcpio/udev/11-dm-initramfs.rules }
  - { type: copy,    from: 11-dm-initramfs.rules, to: /usr/lib/initcpio/udev/11-dm-initramfs.rules, host: true }
  - { type: copy,    from: 80-gamecompatibility.conf, to: /etc/sysctl.d/80-gamecompatibility.conf }

# Run in the target after the user exists.
customize:
  - { type: copy,    from: pacman.conf,      to: /etc/pacman.conf }
  - { type: hostRun, command: "unzip -o @ASSETS@/pacman.d.zip -d @ROOT@/etc/pacman.d" }
  - { type: copy,    from: vconsole.conf,    to: /etc/vconsole.conf, optional: true }
  - { type: enable,  units: [ sddm, NetworkManager ] }

  # boot look: grub theme, plymouth animation
  - { type: copy,    from: "@FAMILY_DIR@/grub",   to: /etc/default/grub }
  - { type: copy,    from: "@FAMILY_DIR@/cachyos", to: /usr/share/grub/themes }
  - { type: copy,    from: "@FAMILY_DIR@/cachyos-bootanimation", to: /usr/share/plymouth/themes }
  - { type: run,     command: "plymouth-set-default-theme -R cachyos-bootanimation", optional: true }

  # first-boot terminal service
  - { type: copy,    from: "@FAMILY_DIR@/term.sh",      to: /usr/local/bin/term.sh }
  - { type: run,     command: "chmod +x /usr/local/bin/term.sh" }
  - { type: copy,    from: "@FAMILY_DIR@/term.service", to: /etc/systemd/system/term.service }
  - { type: enable,  units: [ term.service ], optional: true }

  # user home layout and the claudemods desktop
  - { type: mkdir,   path: "@HOME@/.config/fish" }
  - { type: mkdir,   path: "@HOME@/.local/share/konsole" }
  - { type: run,     command: "chmod +x /usr/share/fish/config.fish", optional: true }
  # Pin each download with sha256 once the files are published (insecure: true skips the check).
  - { type: download, url: "https://claudemodsreloaded.co.uk/arch-systemtool/@TOOL_ZIP@", dest: /opt, insecure: true }
  - { type: download, url: "https://claudemodsreloaded.co.uk/claudemods-desktop/@THEME_ZIP@", dest: "@HOME@", insecure: true }

  - { type: mkdir,   path: /etc/sddm.conf.d }
  - { type: copy,    from: "@FAMILY_DIR@/kde_settings.conf", to: /etc/sddm.conf.d/kde_settings.conf }
  - { type: copy,    from: "@FAMILY_DIR@/@TWEAKS@",          to: "/opt/@TWEAKS@" }
  - { type: run,     command: "chmod +x /opt/@TWEAKS@" }
  # the tweaks script expects to run as the user, from /opt
  - { type: runAsUser, command: "cd /opt && ./@TWEAKS@ @USER@" }
  - { type: remove,  path: "/opt/@TWEAKS@" }

  - { type: copy,    from: "@FAMILY_DIR@/konsolerc", to: "@HOME@/.config/konsolerc" }
  - { type: copy,    from: "@FAMILY_DIR@/@LOGIN_THEME@", to: "/usr/share/sddm/themes/@LOGIN_THEME@" }
  - { type: copy,    from: "@FAMILY_DIR@/claudemods-cyan.colorscheme", to: "@HOME@/.local/share/konsole/claudemods-cyan.colorscheme" }
  - { type: copy,    from: "@FAMILY_DIR@/claudemods-cyan.profile",     to: "@HOME@/.local/share/konsole/claudemods-cyan.profile" }

  # the downloaded theme was made for a user called after the family
  - { type: run,     command: "sed -i 's/@PLACEHOLDER_USER@/@USER@/g' @HOME@/.local/share/user-places.xbel", optional: true }
  - { type: copy,    from: kwalletrc, to: "@HOME@/.config/kwalletrc", optional: true }
  - { type: remove,  path: "@HOME@/.local/share/kwalletd" }

  # wireless regulatory domain (from distroprofile.conf, else from the chosen time zone)
  - { type: regdom }

  # everything above was written as root
  - { type: run,     command: "chown -R @USER@:@USER@ @HOME@" }
  - { type: run,     command: "rm -rf /var/cache/pacman/pkg/*", optional: true }

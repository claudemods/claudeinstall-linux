#
# Packages that were renamed or removed in the repositories. This is plain data, read at
# install time, so a fix is one line here and needs no rebuild.
#
# The installer already follows renames by itself (the "replaces" and "provides" fields of
# the synced repositories, -git/-bin suffixes, one-letter typos). Use this table for the
# cases it cannot guess:
#
#   renames:
#       old-package-name: new-package-name
#   removed:
#       - package-that-is-gone-for-good     # dropped on purpose, and logged
#
# A name that is neither found nor resolved stops the install before anything is
# downloaded, with suggestions in the message.
---
renames: {}
removed: []

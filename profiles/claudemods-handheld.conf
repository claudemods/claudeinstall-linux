#
# Spitfire CKGE Minimal handheld (needed/claudemodshandheld.h). The old script installed
# systemd-boot for this one: choose it in bootloader.conf (efiBootLoader: "systemd-boot").
---
name: "Spitfire CKGE Handheld"
extends: spitfire-base
packages:
  - claudemods-handheld
  - calamares-fix
  - lutris
  - hhd
  - adjustor
  - hhd-ui
  - openrgb
vars:
  THEME_ZIP: spitfire-full-v1.01.zip
  TOOL_ZIP: Arch-Systemtool-v1.01.zip
customize:
  - { type: mkdir,   path: "@HOME@/Desktop" }
  - { type: copy,    from: rsync-installer, to: "@HOME@/Desktop/rsync-installer" }
  - { type: run,     command: "chmod +x @HOME@/Desktop/rsync-installer" }
  - { type: mkdir,   path: /opt/rsync-installer }
  - { type: hostRun, command: "tar xzf @ASSETS@/rsync-installer.tar.gz -C @ROOT@/opt/rsync-installer" }
  - { type: run,     command: "chown -R @USER@:@USER@ @HOME@/Desktop" }

#
# CachyOS KDE handheld (needed/cachyoshandheld.h): the KDE system plus the rsync installer
# launcher on the desktop. The Calamares launcher and its extras are not used.
---
name: "CachyOS KDE Handheld"
extends: cachyos-base
packages:
  - cachyoskdegrub
  - calamares-fix
vars:
  DM: sddm
customize:
  - { type: copy,    from: rsync-installer, to: "@HOME@/Desktop/rsync-installer" }
  - { type: run,     command: "chmod +x @HOME@/Desktop/rsync-installer" }
  - { type: mkdir,   path: /opt/rsync-installer }
  - { type: hostRun, command: "tar xzf @ASSETS@/rsync-installer.tar.gz -C @ROOT@/opt/rsync-installer" }
  - { type: run,     command: "chown -R @USER@:@USER@ @HOME@/Desktop" }

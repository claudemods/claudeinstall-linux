#
# Clone mode: copy the RUNNING system to the target disk.
# No users are created (existing accounts are carried over), and no
# packages are installed or removed. Use with:
# "./build.sh --clone --install" installs this as /etc/claudeinstall/settings.conf
# (and unpackfs-clone.conf under /etc/claudeinstall/modules/).
---
modules-search: [ local ]

instances:
- id:       clone
  module:   unpackfs
  config:   unpackfs-clone.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - summary
- exec:
  - partition
  - mount
  - unpackfs@clone      # rsync of / into the target
  - machineid           # fresh machine-id for the clone
  - fstab               # new UUIDs for the new disk
  - initcpiocfg
  - initcpio
  - initramfs
  - networkcfg
  - hwclock
  - bootloader
  - umount
- show:
  - finished

branding: default
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false

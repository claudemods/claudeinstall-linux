#
# Clone the running root filesystem into the target (rsync -aHAXSr).
---
unpack:
    - source: "/"
      sourcefs: "file"
      destination: ""
      exclude:
        - "/dev/*"
        - "/proc/*"
        - "/sys/*"
        - "/run/*"
        - "/tmp/*"
        - "/mnt/*"
        - "/media/*"
        - "/lost+found"
        - "/swapfile"
        - "/var/cache/*"
        - "/var/tmp/*"
        - "/etc/fstab"          # regenerated by the fstab module
        - "/etc/machine-id"     # regenerated by the machineid module
        - "/var/lib/dbus/machine-id"
        - "/home/*/.cache/*"
        - "/root/.cache/*"
        - "/boot/efi/*"         # recreated by the bootloader module

#
# ClaudeInstall settings for the claudemods distributions: the system is built
# with pacstrap from a profile (see modules/distroprofile) instead of unpacking an image.
---
modules-search: [ local ]

instances:
- id:       distro
  module:   packagechooser
  config:   packagechooser-distro.conf
- id:       install
  module:   distroprofile
  config:   distroprofile.conf
- id:       customize
  module:   distroprofile
  config:   distroprofile-customize.conf

sequence:
- show:
  - welcome
  - packagechooser@distro
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - distroprofile@install
  - machineid
  - locale
  - keyboard
  - localecfg
  - fstab
  - initcpiocfg
  - initcpio
  - users
  - distroprofile@customize
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - initramfs
  - bootloader
  - umount
- show:
  - finished

branding: default
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false